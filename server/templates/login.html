{{template "head" "login"}}
<section class="panel"><header><p class="eyebrow">Your receipt workspace</p><h1>Welcome back</h1><p>Log in to review receipts and manage processing.</p></header>
{{with .Message}}<p class="notice error" role="alert">{{.}}</p>{{end}}
<form method="post" action="/login"><label>Password<input type="password" name="password" autocomplete="current-password" required autofocus></label><button type="submit">Log in</button></form>
</section>{{template "foot"}}
