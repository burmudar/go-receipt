{{template "head"}}
<h2>Log in</h2>
{{with .Message}}<p class="error">{{.}}</p>{{end}}
<form method="post" action="/login">
<label>Password <input type="password" name="password" autocomplete="current-password" required autofocus></label>
<button type="submit">Log in</button>
</form>
{{template "foot"}}
