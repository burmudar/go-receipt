{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipts</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
body.wide { max-width: 72rem; }
.error { color: #a40000; }
dt { font-weight: bold; }
form.inline { display: inline; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { text-align: left; padding: 0.25rem 0.5rem; border-bottom: 1px solid #ddd; }
.number, .nowrap { white-space: nowrap; }
.number { text-align: right; }
.muted { color: #888; }
.receipt-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.receipt-detail iframe { width: 100%; height: 70vh; border: 1px solid #ddd; }
@media (max-width: 650px) { .receipt-detail { grid-template-columns: 1fr; } }
</style>
</head>
{{/* An optional argument is the body class, for example "wide" for a table page. */}}
<body{{with .}} class="{{.}}"{{end}}>
<h1>Receipts</h1>
{{end}}
{{define "foot"}}</body>
</html>
{{end}}
